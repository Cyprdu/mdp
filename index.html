<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Coffre-Fort KeePass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0a0f18] text-gray-200 font-sans min-h-screen flex flex-col items-center justify-center p-4 selection:bg-emerald-500/30">

    <div class="max-w-4xl w-full bg-[#111827] rounded-2xl shadow-[0_0_50px_-12px_rgba(16,185,129,0.1)] overflow-hidden border border-gray-800/60">
        
        <!-- HEADER -->
        <div class="bg-[#0f141e] p-6 border-b border-gray-800/80 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wide flex items-center gap-3 text-white">
                <svg class="w-7 h-7 text-emerald-500 drop-shadow-[0_0_8px_rgba(16,185,129,0.4)]" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                SecureVault
            </h1>
            <div id="status-badge" class="px-3 py-1.5 rounded-md text-xs font-semibold bg-gray-900 text-gray-500 border border-gray-800 shadow-inner tracking-wide uppercase transition-all duration-300">
                Déconnecté
            </div>
        </div>

        <div class="p-8">
            <!-- ETAPE 1 : Connexion Google -->
            <div id="step-auth" class="text-center space-y-8 py-10">
                <div class="flex justify-center">
                    <svg class="w-16 h-16 text-gray-700" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z"/></svg>
                </div>
                <p class="text-gray-400 max-w-md mx-auto leading-relaxed">Connectez-vous à votre espace sécurisé Google Drive pour synchroniser votre base de données chiffrée.</p>
                <button id="btn-login" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-8 rounded-lg transition-all duration-300 shadow-[0_4px_14px_0_rgba(37,99,235,0.39)] hover:shadow-[0_6px_20px_rgba(37,99,235,0.23)] flex items-center gap-3 mx-auto">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                    Autoriser l'accès
                </button>
            </div>

            <!-- ETAPE 2 : Mot de passe Maître -->
            <div id="step-unlock" class="hidden text-center space-y-8 py-10">
                <p class="text-gray-400">Archive chiffrée détectée. Veuillez saisir votre clé de déchiffrement.</p>
                <div class="relative max-w-md mx-auto">
                    <input type="password" id="master-password" placeholder="Mot de passe maître..." class="w-full bg-[#0a0f18] border border-gray-700/80 rounded-lg pl-5 pr-12 py-3.5 text-white placeholder-gray-600 focus:outline-none focus:border-emerald-500/80 focus:ring-1 focus:ring-emerald-500/50 transition-all shadow-inner font-mono text-lg">
                    
                    <button type="button" id="btn-toggle-master" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-500 hover:text-emerald-400 transition-colors">
                        <svg id="icon-master-eye" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
                <button id="btn-unlock" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3.5 px-8 rounded-lg transition-all duration-300 shadow-[0_4px_14px_0_rgba(16,185,129,0.39)] hover:shadow-[0_6px_20px_rgba(16,185,129,0.23)] block mx-auto w-full max-w-md">
                    Déchiffrer la base
                </button>
                <p id="error-msg" class="text-red-400 text-sm hidden font-medium bg-red-500/10 py-2 px-4 rounded-md inline-block border border-red-500/20"></p>
            </div>

            <!-- ETAPE 3 : Liste des mots de passe -->
            <div id="step-dashboard" class="hidden space-y-8">
                <div class="flex justify-between items-center border-b border-gray-800 pb-4">
                    <h2 class="text-xl font-semibold text-gray-100">Données sécurisées</h2>
                    <button id="btn-add" class="group flex items-center gap-2 bg-[#0f141e] border border-gray-700 hover:border-emerald-500/50 text-gray-300 hover:text-emerald-400 font-medium py-2 px-4 rounded-md transition-all duration-300 shadow-sm">
                        <svg class="w-4 h-4 transition-transform group-hover:rotate-90" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 5v14m-7-7h14"/></svg>
                        Nouvelle entrée
                    </button>
                </div>
                
                <div id="passwords-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Les mots de passe s'afficheront ici -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://apis.google.com/js/api.js"></script>
    <script src="https://accounts.google.com/gsi/client"></script>
    <script src="https://unpkg.com/kdbxweb/dist/kdbxweb.js"></script>
    <script src="app.js"></script>
</body>
</html>
