<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Coffre-Fort KeePass</title>
    <!-- Tailwind CSS pour le design moderne et épuré -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-3xl w-full bg-gray-800 rounded-xl shadow-2xl overflow-hidden border border-gray-700">
        
        <!-- HEADER -->
        <div class="bg-gray-950 p-6 border-b border-gray-700 flex justify-between items-center">
            <h1 class="text-2xl font-semibold tracking-wide flex items-center gap-3">
                <svg class="w-6 h-6 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                SecureVault
            </h1>
            <div id="status-badge" class="px-3 py-1 rounded-full text-xs font-medium bg-red-900/50 text-red-400 border border-red-800">
                Déconnecté
            </div>
        </div>

        <div class="p-8">
            <!-- ETAPE 1 : Connexion Google -->
            <div id="step-auth" class="text-center space-y-6">
                <p class="text-gray-400">Connectez-vous à Google Drive pour synchroniser votre fichier .kdbx.</p>
                <button id="btn-login" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-6 rounded-lg transition duration-200 flex items-center justify-center gap-2 mx-auto">
                    Connexion Google Drive
                </button>
            </div>

            <!-- ETAPE 2 : Mot de passe Maître -->
            <div id="step-unlock" class="hidden text-center space-y-6">
                <p class="text-gray-400">Fichier trouvé. Entrez votre mot de passe maître pour déchiffrer.</p>
                <input type="password" id="master-password" placeholder="Mot de passe maître..." class="w-full max-w-md mx-auto bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition">
                <button id="btn-unlock" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 px-6 rounded-lg transition duration-200 block mx-auto">
                    Déverrouiller
                </button>
                <p id="error-msg" class="text-red-400 text-sm hidden"></p>
            </div>

            <!-- ETAPE 3 : Liste des mots de passe -->
            <div id="step-dashboard" class="hidden space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-xl font-medium">Vos Mots de Passe</h2>
                    <button id="btn-add" class="bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600 hover:text-white border border-emerald-600/50 font-medium py-2 px-4 rounded transition duration-200">
                        + Ajouter
                    </button>
                </div>
                
                <div id="passwords-list" class="space-y-3">
                    <!-- Les mots de passe s'afficheront ici -->
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts Google et kdbxweb -->
    <script src="https://apis.google.com/js/api.js"></script>
    <script src="https://accounts.google.com/gsi/client"></script>
    <script src="https://cdn.jsdelivr.net/npm/kdbxweb@2.1.2/dist/kdbxweb.js"></script>
    <script src="app.js"></script>
</body>
</html>
